<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>
</head>
<body>

<h2>Notificacoes de Novos Albuns</h2>

<ul id="messages"></ul>

<script>
    console.log("Caminho: ", window.location.origin);
    // Especifique a URL completa do seu servidor Spring Boot
    //const socket = new SockJS("http://localhost:8080/ws");    //para rodar local
    const socket = new SockJS("/ws");
    //const socket = new SockJS(window.location.origin + "/ws");
    const stompClient = Stomp.over(socket);

    stompClient.connect({}, function (frame) {
        console.log("Conectado com sucesso!");

        stompClient.subscribe("/topic/albums", function (message) {
            console.log("Mensagem recebida: ", message.body);
            const album = JSON.parse(message.body);

            const li = document.createElement("li");
            li.innerText = `Novo album cadastrado: ${album.idenAlbum} - ${album.descricaoAlbum} - ${album.descricaoTipoAlbum}`;
            document.getElementById("messages").appendChild(li);
        });
    }, function (error) {
        console.error("Erro na conexão STOMP:", error);
    });
</script>

</body>
</html>
